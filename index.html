<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assignmentcss02.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Airmax Shoes Product Card</title>
</head>
<body>
    <div class="card-container">
        <!-- left side  -->
         <div class="left-section">
            <div class="orange-bg"></div>
              <img src="./blackshoes-removebg-preview.png" alt="nice shoes" class="shoes-img">

            <!-- arrow button  -->
            <div class="arrow-buttons">
              <button class="arrow-btn"><i class="fa-solid fa-arrow-left"></i></button>
              <button class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
         </div>

         <!-- right-section-card -->
          <div class="card">
            <div class="card-header">
                <h2 class="logo">Airmax</h2>
                <div class="top-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-user"></i>
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
             </div>
              
             <!-- Product content  -->
                 <p class="subtite">Winter Collection</p>
                 <h1 class="product-title">Man black Snackers</h1>
                 <div class="price-box">
                    <span class="current-price">$150</span>
                    <span class="old-price">$250</span>
                 </div>
                 <!-- size number option  -->
                  <div class="size-section">
                    <span class="label">SIZE</span>
                    <span class="size-num">7</span>
                    <span class="size-num">8</span>
                    <span class="size-num">9</span>
                    <span class="size-num">10</span>
                    <span class="size-num">11</span>
                  </div>
                  <!-- color -->
                   <div class="color-section">
                    <span class="label">COLOR</span>
                    <span class="color-circle yellow"></span>
                    <span class="color-circle black" ></span>
                    <span class="color-circle blue"></span>
                   </div>
                   <!-- buy and cart icon  -->
                    <div class="action-button">
                        <button class="buy-btn"><i class="fa-solid fa-bag-shopping"></i> Buy Now</button>
                        <button class="cart-btn"><i class="fa-solid fa-cart-plus"></i> Add To Cart</button>
                    </div>
          </div>
         
    </div>
</body>
</html>
